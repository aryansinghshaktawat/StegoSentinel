name: StegoSentinel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Test & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Generate synthetic test fixtures
        run: |
          python scripts/generate_fixtures.py

      - name: Install backend dependencies
        run: |
          cd backend
          uv venv
          uv pip install -e ".[dev]" pyjwt

      - name: Lint with Ruff
        run: |
          cd backend
          uv run ruff check app/ tests/

      - name: Run Unit & Analyzer Tests
        run: |
          cd backend
          uv run pytest tests/unit/ -v

      - name: Run Security & Boundary Tests
        run: |
          cd backend
          uv run pytest tests/security/ -v

      - name: Run Integration Tests & Coverage
        run: |
          cd backend
          uv run pytest tests/integration/ -v --cov=app --cov-report=xml

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js Bundle
        run: |
          cd frontend
          npm run build
